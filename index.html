<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Habit Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Daily Habit Tracker</h1>

    <div>
        <input type="text" id="habitInput" placeholder="Enter a habit">
        <button class="add-btn" onclick="addHabit()">Add</button>
    </div>

    <ul id="habitList"></ul>

    <div class="progress" id="progressText">Progress: 0%</div>

    <button class="reset-btn" onclick="resetHabits()">Reset Day</button>
</div>

<script src="script.js"></script>
</body>
</html>
